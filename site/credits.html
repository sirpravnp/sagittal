<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Model credits · Sagittal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  .credits{max-width:820px;margin:0 auto;padding:40px 20px 56px}
  .credits h1{font:400 1.6rem/1.3 var(--serif);margin:0 0 12px}
  .credits pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:16px}
  @media (max-width:640px){.credits{padding:24px 16px 40px}}
</style>
</head>
<body>
<main class="credits">
  <p><a href="index.html">Sagittal</a></p>
  <h1>Model credits</h1>
  <p>The 3D anatomy in Sagittal's scenes, card images and Anki decks is adapted from the open works below.
    Full text of <a href="meshes/CREDITS.md">meshes/CREDITS.md</a>:</p>
  <pre id="credits-text">Loading…</pre>
</main>
<script>
  // Plain text only (textContent): no Markdown rendering, nothing from the file reaches innerHTML.
  fetch('meshes/CREDITS.md').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (t) {
    document.getElementById('credits-text').textContent = t;
  }).catch(function (e) {
    document.getElementById('credits-text').textContent = 'Could not load meshes/CREDITS.md (' + e.message + ').';
  });
</script>
</body>
</html>
