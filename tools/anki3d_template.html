<div>{{Title}}</div>
<div id="s3d-stage"><canvas id="s3d-cv"></canvas><div id="s3d-labels"></div></div>
<div id="s3d-fallback" style="display:none">{{Fallback}}</div>
<div class="prompt">Drag to rotate, then identify the labelled structures</div>
<div class="status sagittal-review">{{Status}}</div>
<div id="s3d-status" class="status">Loading 3D...</div>
<script>
(function () {
  var sceneId = "{{SceneId}}", ctl = "{{VariantControl}}", variant = "{{VariantKey}}";
  var G = window.__sagittal3d = window.__sagittal3d || { done: {} };

  function fallback(why) {
    var st = document.getElementById('s3d-stage');
    var fb = document.getElementById('s3d-fallback');
    var s = document.getElementById('s3d-status');
    if (st) st.style.display = 'none';
    if (fb) {
      fb.style.display = '';
      // unlabelled image on the front, labelled image on the back (CSS does the same)
      var back = !!document.getElementById('sagittal-back');
      var imgs = fb.getElementsByTagName('img');
      for (var i = 0; i < imgs.length; i++) {
        var c = imgs[i].className;
        if (c === 'fb-front' || c === 'fb-back') imgs[i].style.display = (c === 'fb-back') === back ? '' : 'none';
      }
    }
    if (s) s.textContent = '3D unavailable — showing image';
    try { console.log('sagittal 3D fallback: ' + why); } catch (e) {}
  }

  // Load scripts one after another; skip any already loaded in this web view.
  function chain(srcs, ok, bad) {
    if (!srcs.length) return ok();
    var src = srcs[0], rest = srcs.slice(1);
    if (G.done[src]) return chain(rest, ok, bad);
    var el = document.createElement('script');
    el.onload = function () { G.done[src] = true; chain(rest, ok, bad); };
    el.onerror = function () { bad(src); };
    el.src = src;
    document.head.appendChild(el);
  }

  function render() {
    var cv = document.getElementById('s3d-cv');
    if (!cv || !cv.isConnected) return; // card already replaced while scripts loaded
    try {
      var viewer = window.Kit.createViewer({
        canvas: cv, labelsEl: document.getElementById('s3d-labels')
      });
      var state = {};
      state[ctl] = variant;
      if (!viewer.available || !viewer.open(sceneId, state)) return fallback('viewer unavailable');
      // labels reveal the answer: show them only on the back (marker precedes FrontSide)
      viewer.setLabelsVisible(!!document.getElementById('sagittal-back'));
      var s = document.getElementById('s3d-status');
      if (s) s.textContent = '3D OK';
    } catch (e) {
      fallback(String(e));
    }
  }

  function bad(src) { fallback('failed to load ' + src); }
  // The scene script registers its SceneDef; then load the baked meshes it declares, then render.
  chain(['_three.min.js', '_labels.js', '_kit.js', '_scene_' + sceneId + '.js'], function () {
    var def = window.Kit && window.Kit.get(sceneId);
    var meshes = ((def && def.meshes) || []).filter(function (m) {
      return !(window.SagittalMeshes && window.SagittalMeshes[m]);
    }).map(function (m) { return '_mesh_' + m + '.js'; });
    chain(meshes, render, bad);
  }, bad);
})();
</script>
