<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy 3D Spike</title>
<style>
:root{--bg:#0f141b;--panel:#171f2a;--ink:#e8edf3;--mut:#93a1b3;--acc:#5ec2ff;--line:#2a3646}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0 0 8px;font-weight:600}
h1 span{color:var(--mut);font-weight:400}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
#tabs button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
#tabs button.on{border-color:var(--acc);color:var(--acc)}
main{display:grid;grid-template-columns:1fr 340px;height:calc(100% - 92px)}
#stage{position:relative;min-height:320px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;background:rgba(15,20,27,.82);border:1px solid #3a4a5e;border-radius:4px;padding:1px 6px;color:#fff}
.lab::before{content:"";position:absolute;left:-5px;top:50%;width:5px;height:1px;background:#8aa}
#hint{position:absolute;left:10px;bottom:8px;color:var(--mut);font-size:12px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h2{font-size:16px;margin:0 0 8px}
.ctl{margin:0 0 12px}
.ctl label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.ctl select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 8px}
#info{font-size:13px;color:#cdd6e1;border-top:1px solid var(--line);padding-top:10px}
#info b{color:#fff}
#info ul{padding-left:18px;margin:6px 0}
.note{color:var(--mut);font-size:12px;margin-top:12px}
@media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55% 45%;height:calc(100% - 120px)}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Anatomy 3D <span>prototype - stylized schematic models, not to scale</span></h1>
  <div id="tabs"></div>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas><div id="labels"></div><div id="hint">drag to rotate · scroll to zoom</div></div>
  <aside><h2 id="title"></h2><div id="controls"></div><div id="info"></div>
  <div class="note">Stylized teaching schematics. Verify details against your reference before relying on them.</div></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const D=Math.PI/180;
const cv=document.getElementById('cv'),stage=document.getElementById('stage'),labBox=document.getElementById('labels');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.localClippingEnabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f141b);
const cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,9);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.0));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,7);scene.add(dl);
const root=new THREE.Group();scene.add(root);

/* ---------- helpers ---------- */
function mat(c,o=1,x={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:0,transparent:o<1,opacity:o,side:THREE.DoubleSide,depthWrite:o>=.95},x));}
function add(g,geo,m,p=[0,0,0],s=[1,1,1]){const me=new THREE.Mesh(geo,m);me.position.set(p[0],p[1],p[2]);me.scale.set(s[0],s[1],s[2]);g.add(me);return me;}
function ell(g,c,o,p,s,x){return add(g,new THREE.SphereGeometry(1,32,24),mat(c,o,x),p,s);}
function seg(g,a,b,r,m){a=V(...a);b=V(...b);const d=b.clone().sub(a),L=d.length();const me=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,14,1),m);me.position.copy(a).add(b).multiplyScalar(.5);me.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());g.add(me);return me;}
function tube(g,pts,r,m,n=48){const c=new THREE.CatmullRomCurve3(pts.map(p=>V(...p)));const me=new THREE.Mesh(new THREE.TubeGeometry(c,n,r,12,false),m);g.add(me);return me;}
function arrow(g,a,b,col=0xffd23f){a=V(...a);b=V(...b);const d=b.clone().sub(a),L=d.length();const gr=new THREE.Group();const m=mat(col,1,{emissive:col,emissiveIntensity:.6});
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,L-.22,10),m);sh.position.y=(L-.22)/2;
  const hd=new THREE.Mesh(new THREE.ConeGeometry(.13,.22,12),m);hd.position.y=L-.11;gr.add(sh,hd);gr.position.copy(a);gr.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());g.add(gr);return gr;}
function ring(g,p,r,col=0xffd23f,rot=[0,0,0]){const me=add(g,new THREE.TorusGeometry(r,.05,10,36),mat(col,1,{emissive:col,emissiveIntensity:.6}),p);me.rotation.set(rot[0],rot[1],rot[2]);return me;}
function sector(r0,r1,a0,a1,depth){const s=new THREE.Shape();s.absarc(0,0,r1,a0,a1,false);s.absarc(0,0,r0,a1,a0,true);const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:48});g.translate(0,0,-depth/2);return g;}
function disk(r,depth){const s=new THREE.Shape();s.absarc(0,0,r,0,Math.PI*2,false);const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:48});g.translate(0,0,-depth/2);return g;}
function dot(g,p,col=0xffd23f,r=.1){return add(g,new THREE.SphereGeometry(r,16,12),mat(col,1,{emissive:col,emissiveIntensity:.7}),p);}

/* ---------- scenes ---------- */
const SC={};

/* 1. Congenital heart defects */
SC.heart={tab:'Congenital heart defects',title:'Congenital heart defects',center:[0,.3,0],zoom:9.5,rot:[-.15,.35],
controls:[{k:'d',label:'Defect',def:'normal',opts:[['normal','Normal heart'],['asd','Atrial septal defect (ASD)'],['vsd','Ventricular septal defect (VSD)'],['pda','Patent ductus arteriosus (PDA)'],['tof','Tetralogy of Fallot'],['tga','Transposition of great arteries']]}],
build(g,st){
 const d=st.d,B=0x3a6fd8,R=0xd8403a,P=0x9553c9;
 const c={RA:B,RV:B,LA:R,LV:R,AO:R,PA:B};
 if(d==='asd'){c.RA=c.RV=c.PA=P}
 if(d==='vsd'){c.RV=c.PA=P}
 if(d==='pda'){c.PA=P}
 if(d==='tof'){c.AO=P}
 if(d==='tga'){c.AO=B;c.PA=R}
 const rvS=d==='tof'?[.98,1.14,.85]:[.8,1,.7];
 ell(g,c.RA,.72,[-1.1,.9,0],[.7,.8,.6]);
 ell(g,c.LA,.72,[1.1,.9,-.4],[.7,.7,.6]);
 ell(g,c.RV,.72,[-.4,-.7,.3],rvS);
 ell(g,c.LV,.72,[.7,-.7,0],[.85,1.1,.7]);
 add(g,new THREE.BoxGeometry(.06,1.6,1),mat(0xcccccc,.6),[.15,-.7,.15]);
 add(g,new THREE.BoxGeometry(.06,1.2,.9),mat(0xcccccc,.6),[0,.9,-.2]);
 const tail=[[1.7,2.2,-.6],[2,1,-.8],[2,-.9,-.8]];
 let ao;
 if(d==='tga')ao=[[-.4,-.1,.45],[-.3,.9,.6],[-.1,1.8,.3],[.8,2.5,-.3]].concat(tail);
 else if(d==='tof')ao=[[.1,-.15,.15],[.15,.9,0],[.2,1.7,-.1],[.8,2.5,-.3]].concat(tail);
 else ao=[[.4,-.2,-.1],[.2,.9,-.1],[.2,1.7,-.1],[.8,2.5,-.3]].concat(tail);
 tube(g,ao,.27,mat(c.AO,.9));
 const pr=d==='tof'?.12:.22;
 if(d==='tga'){
  tube(g,[[.4,-.2,-.1],[.2,.9,-.1],[.2,1.7,-.2]],pr,mat(c.PA,.9),20);
  tube(g,[[.2,1.7,-.2],[-.6,1.95,-.2],[-1.5,2,-.2]],pr*.8,mat(c.PA,.9),20);
  tube(g,[[.2,1.7,-.2],[.8,1.9,-.1],[1.3,1.9,0]],pr*.8,mat(c.PA,.9),20);
 }else{
  tube(g,[[-.4,-.1,.5],[-.3,.9,.6],[-.2,1.7,.4]],pr,mat(c.PA,.9),20);
  tube(g,[[-.2,1.7,.4],[-.7,1.95,.1],[-1.5,2,-.1]],pr*.8,mat(c.PA,.9),20);
  tube(g,[[-.2,1.7,.4],[.5,1.95,.3],[1.3,1.9,0]],pr*.8,mat(c.PA,.9),20);
 }
 const L=[{t:'Right atrium',p:[-1.6,1.4,.3]},{t:'Left atrium',p:[1.7,1.3,-.4]},{t:'Right ventricle',p:[-1.3,-1.2,.5]},{t:'Left ventricle',p:[1.5,-1.2,.2]},{t:'Aorta',p:[1.4,2.5,-.5]},{t:'Pulmonary artery',p:[-1.6,2.3,.3]}];
 let info='';
 if(d==='normal'){info='<ul><li>Blue = deoxygenated, red = oxygenated, purple = mixed.</li><li>Systemic return: RA → RV → pulmonary artery. Pulmonary return: LA → LV → aorta.</li><li>Left-sided pressures exceed right-sided, so a hole between the sides shunts left → right unless the right side is obstructed.</li></ul>';}
 if(d==='asd'){ring(g,[0,.9,-.2],.3,0xffd23f,[0,Math.PI/2,0]);arrow(g,[.8,.95,-.25],[-.5,.95,-.25]);L.push({t:'ASD',p:[0,1.5,-.2]});
  info='<ul><li><b>Left-to-right shunt</b> at atrial level (ostium secundum most common; ostium primum is associated with Down syndrome).</li><li>Right atrial/ventricular volume overload and increased pulmonary flow.</li><li>Fixed split S2; systolic ejection murmur at the left upper sternal border (extra flow across the pulmonic valve).</li><li>Paradoxical embolism is possible. Eisenmenger if the shunt reverses.</li></ul>';}
 if(d==='vsd'){ring(g,[.15,-.4,.15],.28,0xffd23f,[0,Math.PI/2,0]);arrow(g,[.7,-.4,.1],[-.2,-.4,.2]);L.push({t:'VSD (membranous)',p:[.2,-1.7,.4]});
  info='<ul><li>Most common congenital heart defect; membranous septum is the usual site.</li><li><b>Left-to-right shunt</b>; holosystolic murmur at the left lower sternal border (smaller defects are louder).</li><li>Large defects: pulmonary overcirculation, heart failure, then pulmonary hypertension and <b>Eisenmenger</b> (shunt reverses, cyanosis, clubbing).</li></ul>';}
 if(d==='pda'){tube(g,[[1.75,1.9,-.65],[1.4,1.95,-.3],[1,1.93,.15]],.1,mat(0xffd23f,1,{emissive:0xffd23f,emissiveIntensity:.4}),12);arrow(g,[1.9,1.6,-.7],[1.3,1.4,-.1]);L.push({t:'Ductus (PDA)',p:[1.9,1.5,-.2]});
  info='<ul><li>Persistent channel between the <b>descending aorta (just distal to the left subclavian)</b> and the left pulmonary artery.</li><li>Left-to-right shunt: continuous “machinery” murmur, bounding pulses, wide pulse pressure.</li><li>Associated with prematurity and maternal rubella. Closure: indomethacin/ibuprofen. If a ductus-dependent lesion exists, keep it open with prostaglandin E1.</li></ul>';}
 if(d==='tof'){ring(g,[.15,-.4,.15],.28,0xffd23f,[0,Math.PI/2,0]);ring(g,[-.37,.2,.52],.2,0xff7a3f,[Math.PI/2,0,0]);arrow(g,[-.2,-.4,.2],[.6,-.2,.1]);L.push({t:'VSD',p:[.2,-1.7,.4]},{t:'Pulmonary stenosis',p:[-1.4,.4,.7]},{t:'RV hypertrophy',p:[-1.5,-.4,.8]},{t:'Overriding aorta',p:[.9,.3,.2]});
  info='<ul><li>Four features: <b>pulmonary (infundibular) stenosis, RVH, overriding aorta, VSD.</b></li><li>Right-to-left shunt across the VSD → cyanosis. “Tet spells” improve with squatting (raises SVR, pushes blood toward the lungs).</li><li>Boot-shaped heart on CXR. Associated with 22q11 deletion. Classically the most common cyanotic CHD beyond infancy.</li></ul>';}
 if(d==='tga'){ring(g,[0,.9,-.2],.3,0xffd23f,[0,Math.PI/2,0]);L.push({t:'Mixing site needed (ASD/VSD/PDA)',p:[0,1.5,-.2]});
  info='<ul><li><b>Aorta arises from the RV; pulmonary artery from the LV</b> → two parallel circuits.</li><li>Not compatible with life without mixing (PDA, ASD or VSD). Cyanosis in the first days of life.</li><li>“Egg on a string” CXR (narrow mediastinum). Associated with maternal diabetes.</li><li>Keep the ductus open with prostaglandin E1; definitive fix is the arterial switch.</li></ul>';}
 return{labels:L,info};
}};

/* 2. Aortic dissection */
SC.aorta={tab:'Aortic dissection',title:'Aortic dissection',center:[1,0,0],zoom:8.5,rot:[-.1,.2],
controls:[{k:'v',label:'Perspective',def:'ext',opts:[['ext','Aortic (external, whole aorta)'],['int','Intimal (wall layers in cross-section)']]},{k:'t',label:'Stanford type (aortic view)',def:'A',opts:[['A','Type A (involves ascending aorta)'],['B','Type B (distal to left subclavian)']]},{k:'x',label:'Wall in cross-section',def:'dis',opts:[['norm','Normal wall'],['dis','Dissection']]}],
build(g,st){
 const L=[];let info='';
 if(st.v==='ext'){
  const pts=[[0,-2,0],[0,-.5,0],[.1,.7,0],[.7,1.6,0],[1.5,1.7,0],[2.1,1,0],[2.2,-.3,0],[2.2,-2.3,0]].map(p=>V(...p));
  const cur=new THREE.CatmullRomCurve3(pts);
  add(g,new THREE.TubeGeometry(cur,80,.3,16,false),mat(0xd8605a,.45));
  ell(g,0xd8605a,.5,[0,-2,0],[.5,.35,.5]);
  [[.7,1.65,.75,2.4],[1.1,1.72,1.15,2.5],[1.45,1.74,1.55,2.45]].forEach(b=>seg(g,[b[0],b[1],0],[b[2],b[3],0],.1,mat(0xd8605a,.6)));
  const t0=st.t==='A'?.2:.62,t1=st.t==='A'?.85:.93;
  const sub=[];for(let i=0;i<=40;i++)sub.push(cur.getPoint(t0+(t1-t0)*i/40).add(V(0,0,.17)));
  add(g,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sub),80,.15,12,false),mat(0x6b0f0f,.95));
  const tp=cur.getPoint(t0).add(V(0,0,.3));dot(g,[tp.x,tp.y,tp.z],0xffd23f,.12);
  L.push({t:'Entry tear (intimal)',p:[tp.x-.1,tp.y,tp.z+.1]},{t:'False lumen',p:[2.5,.3,.3]},{t:'True lumen',p:[2.5,-1.2,0]},{t:'Aortic root / valve',p:[-.8,-2,0]},{t:'Arch branches',p:[1.1,2.7,0]},{t:'Descending aorta',p:[2.6,-1.9,0]});
  info=st.t==='A'
   ?'<ul><li><b>Stanford A</b>: involves the ascending aorta (± arch/descending). Surgical emergency.</li><li>Complications: aortic regurgitation, tamponade, coronary (usually RCA) occlusion, stroke.</li></ul>'
   :'<ul><li><b>Stanford B</b>: distal to the left subclavian artery. Usually medical: IV beta-blocker first (impulse control), then vasodilator.</li><li>Complications: renal or mesenteric malperfusion, limb ischemia, rupture.</li></ul>';
  info+='<ul><li>Tearing chest/back pain, BP difference between arms, widened mediastinum on CXR.</li><li>Risk: hypertension, Marfan/Ehlers-Danlos, bicuspid valve, cocaine, trauma.</li></ul>';
 }else{
  const dep=1.6,dis=st.x==='dis';
  const mi=mat(0xf0c9b6,.95),mm=mat(0xb04a4a,.8),ma=mat(0xc9a27a,.85);
  const tearA=.70,tearB=.80,flEnd=3.0;
  if(!dis){
   add(g,sector(.95,1,0,Math.PI*2,dep),mi);add(g,sector(1,1.35,0,Math.PI*2,dep),mm);add(g,sector(1.35,1.55,0,Math.PI*2,dep),ma);
   add(g,disk(.93,dep),mat(0xd8403a,.35));
   info='<ul><li>Three layers: <b>intima</b> (endothelium), <b>media</b> (elastic lamellae and smooth muscle, most of the strength), <b>adventitia</b>.</li><li>Cystic medial degeneration weakens the media (Marfan, aging, hypertension).</li></ul>';
  }else{
   add(g,sector(.95,1,flEnd,Math.PI*2+tearA,dep),mi);
   add(g,sector(1,1.1,flEnd,Math.PI*2+tearA,dep),mm);
   const flap=new THREE.Group();add(flap,sector(.95,1.1,tearB,flEnd,dep),mat(0xe9a98f,.95));flap.scale.set(.84,.84,1);g.add(flap);
   add(g,sector(1.1,1.25,tearA,flEnd,dep),mat(0x6b0f0f,.8));
   add(g,sector(1.1,1.25,flEnd,Math.PI*2+tearA,dep),mm);
   add(g,sector(1.25,1.35,0,Math.PI*2,dep),mm);
   add(g,sector(1.35,1.55,0,Math.PI*2,dep),ma);
   add(g,disk(.78,dep),mat(0xd8403a,.35));
   arrow(g,[.37,.34,0],[.86,.8,0]);
   info='<ul><li>An <b>intimal tear</b> lets blood enter the media and split the layers, creating a <b>false lumen</b>.</li><li>The <b>intimal flap</b> separates true and false lumens and can occlude branch vessels (malperfusion).</li><li>Shown here as a cutaway: the wall layers from the inside out.</li></ul>';
  }
  const lp=(r,a)=>[r*Math.cos(a*D),r*Math.sin(a*D),dep/2];
  L.push({t:'Intima',p:lp(.97,200)},{t:'Media',p:lp(1.2,250)},{t:'Adventitia',p:lp(1.46,300)},{t:'True lumen',p:[0,0,dep/2]});
  if(dis)L.push({t:'Intimal tear',p:lp(1.0,43)},{t:'False lumen',p:lp(1.18,110)},{t:'Intimal flap',p:lp(.8,150)});
 }
 return{labels:L,info};
}};

/* 3. Flail chest */
function ribPt(i,th){const k=Math.sin(Math.PI*(i+1)/9);const a=1.25+.3*k,b=.8+.25*k,y=1.5-i*.42;const f=Math.max(0,Math.sin(th*D));return[a*Math.cos(th*D),y-.3*f,b*Math.sin(th*D)];}
function ribArc(i,t0,t1){const n=Math.max(4,Math.ceil((t1-t0)/10)),p=[];for(let j=0;j<=n;j++)p.push(ribPt(i,t0+(t1-t0)*j/n));return p;}
SC.flail={tab:'Flail chest',title:'Flail chest',center:[0,0,0],zoom:8,rot:[-.15,-.5],
controls:[{k:'ph',label:'Breathing phase',def:'anim',opts:[['anim','Animate'],['insp','Inspiration'],['exp','Expiration']]},{k:'c',label:'Show pulmonary contusion',def:'on',type:'chk'}],
build(g,st){
 const thorax=new THREE.Group(),flail=new THREE.Group();g.add(thorax,flail);
 const bone=mat(0xe9dcc3,1),red=mat(0xe23b3b,1,{emissive:0x661111});
 for(let i=0;i<8;i++){
  const isF=i>=2&&i<=5;
  if(!isF){tube(thorax,ribArc(i,104,436),.05,bone,40);}
  else{
   tube(thorax,ribArc(i,104,338),.05,bone,32);tube(thorax,ribArc(i,422,436),.05,bone,4);
   tube(flail,ribArc(i,345,415),.05,bone,10);
   ell(thorax,0xe23b3b,1,ribPt(i,340),[.07,.07,.07]);ell(thorax,0xe23b3b,1,ribPt(i,420),[.07,.07,.07]);
  }
 }
 add(thorax,new THREE.BoxGeometry(.45,2.7,.1),mat(0xd9cdb4),[0,.05,.88]);
 tube(thorax,[[0,1.8,-.95],[0,0,-1],[0,-1.8,-.9]],.11,mat(0xbfb59d));
 ell(thorax,0xe99aa6,.4,[-.65,0,0],[.55,1.2,.7]);ell(thorax,0xe99aa6,.4,[.65,0,0],[.55,1.2,.7]);
 if(st.c)ell(thorax,0xb22222,.75,[.8,.15,.35],[.3,.45,.3]);
 const fp=ribPt(3,380);
 const L=[{t:'Flail segment (≥3 ribs, ≥2 fractures each)',p:[fp[0]+.2,fp[1]+.5,fp[2]+.2]},{t:'Fracture sites',p:[...ribPt(2,340)].map((v,i)=>i===0?v+.25:v)},{t:'Sternum',p:[-.3,1.5,.95]}];
 if(st.c)L.push({t:'Pulmonary contusion',p:[.9,-.5,.45]});
 const dir=V(Math.cos(20*D),0,Math.sin(20*D));
 const update=(t)=>{const s=st.ph==='insp'?1:st.ph==='exp'?-1:Math.sin(t*1.6);
  thorax.scale.set(1+.05*s,1,1+.05*s);flail.position.copy(dir).multiplyScalar(-.14*s);};
 const info='<ul><li><b>Flail chest</b>: ≥3 adjacent ribs each fractured in ≥2 places, producing a free-floating segment.</li><li><b>Paradoxical motion</b>: the segment moves inward on inspiration and outward on expiration (watch the loose ribs against the rest of the thorax).</li><li>Hypoxia is driven mainly by the underlying <b>pulmonary contusion</b> and pain-limited breathing, not the paradoxical motion itself.</li><li>Management: oxygen, analgesia (including regional blocks), judicious fluids; ventilatory support if failing; rib fixation in selected patients.</li></ul>';
 return{labels:L,info,update};
}};

/* 4. Tension pneumothorax (coronal) */
SC.tension={tab:'Tension pneumothorax',title:'Tension pneumothorax',center:[0,0,0],zoom:9,rot:[0,0],
controls:[{k:'s',label:'State',def:'tension',opts:[['normal','Normal chest'],['tension','Tension pneumothorax (patient’s right)']]}],
build(g,st){
 const T=st.s==='tension';
 const wall=new THREE.Shape();wall.moveTo(-2.4,-2.4);wall.bezierCurveTo(-3.1,-1,-3,1.8,-1.5,2.7);wall.lineTo(1.5,2.7);wall.bezierCurveTo(3,1.8,3.1,-1,2.4,-2.4);wall.lineTo(-2.4,-2.4);
 const wg=new THREE.ExtrudeGeometry(wall,{depth:1.2,bevelEnabled:false});wg.translate(0,0,-.6);
 add(g,wg,mat(0x8899aa,.1));
 g.add(new THREE.LineSegments(new THREE.EdgesGeometry(wg,30),new THREE.LineBasicMaterial({color:0x6f8196})));

 add(eye,new THREE.SphereGeometry(1.42,40,28,0,Math.PI*2,.6,Math.PI-.6),cm(0x6b2a1f,.85));
 const retCol=c==='cra'?0xe8d8c8:0xf0903a;
 if(c==='rd'){
  add(eye,new THREE.SphereGeometry(1.36,40,28,0,Math.PI*2,.6,1.5),cm(retCol,.9));
  add(eye,new THREE.SphereGeometry(1.36,40,28,0,Math.PI*2,2.55,Math.PI-2.55),cm(retCol,.9));
  const flap=add(eye,new THREE.SphereGeometry(1.1,40,28,.9,2.4,2.1,.45),cm(retCol,.9));flap.position.y=-.1;
  const flap2=add(eye,new THREE.SphereGeometry(1.1,40,28,3.3+.1,2.4-.2,2.1,.45),cm(retCol,.9));flap2.position.y=-.1;
 }else add(eye,new THREE.SphereGeometry(1.36,40,28,0,Math.PI*2,.6,Math.PI-.6),cm(retCol,.85));
 ell(eye,0xdfeaf2,.0001,[0,0,0],[.001,.001,.001]);
 add(eye,new THREE.SphereGeometry(1,32,24),cm(0xd8f0ff,.75),[0,ac?.8:.75,0],[.55,.32,.55]);
 const iy=ac?1.12:.93;
 const ir=add(eye,new THREE.RingGeometry(ac?.3:.22,.78,40),cm(0x3a78b8,.95),[0,iy,0]);ir.rotation.x=-Math.PI/2;
 add(eye,new THREE.TorusGeometry(.88,.1,10,32),cm(0xcba37a,.95),[0,.98,0]).rotation.x=Math.PI/2;
 const tm=add(eye,new THREE.TorusGeometry(.77,.04,8,32),cm(ac?0xff3b3b:0x2fd0c0,1),[0,1.14,0]);tm.rotation.x=Math.PI/2;
 tube(eye,[[.35,-1.4,0],[.45,-2,0],[.6,-2.8,0]],.2,mat(0xf1ede0,.95),12);
 const fovea=c==='cra'?0xc81e1e:0x7a3a10;
 dot(eye,[0,-1.34,0],c==='cra'?0xe02020:0xf2d04a,.17);dot(eye,[0,-1.38,0],fovea,.07);
 dot(eye,[.35,-1.37,0],0xffffff,.12);
 const L=[{t:'Cornea',p:[1.5,0,0]},{t:'Iris / pupil',p:[1.05,1.05,0]},{t:'Lens',p:[.8,-.6,0]},{t:'Anterior chamber',p:[1.4,.7,0]},{t:'Vitreous',p:[-.2,0,0]},{t:'Retina',p:[-1.45,1,0]},{t:'Choroid',p:[-1.7,-.8,0]},{t:'Sclera',p:[-1.9,-1.2,0]},{t:'Macula / fovea',p:[-1.5,.05,0]},{t:'Optic disc / nerve',p:[-2,.5,0]},{t:'Trabecular meshwork / canal of Schlemm',p:[.8,1.7,0]},{t:'Ciliary body',p:[.9,.55,0]}];
 const infos={norm:'<ul><li>Light path: cornea → aqueous (anterior chamber) → pupil → lens → vitreous → retina (macula/fovea for central vision).</li><li>Aqueous is made by the ciliary body, passes through the pupil, and drains through the <b>trabecular meshwork / canal of Schlemm</b> at the iridocorneal angle.</li><li>The cutaway is oriented with the front on the right; rotate to explore.</li></ul>',
  ac:'<ul><li><b>Acute angle-closure</b>: the peripheral iris bows forward against the trabecular meshwork (red), blocking aqueous drainage → rapid IOP rise.</li><li>Painful red eye, halos, headache, nausea/vomiting, <b>mid-dilated fixed pupil</b>, hazy cornea. An emergency.</li><li>Treat: lower IOP (acetazolamide, topical beta-blocker, alpha agonist, pilocarpine once IOP falls) then laser peripheral iridotomy. Avoid mydriatics.</li></ul>',
  rd:'<ul><li><b>Retinal detachment</b>: fluid passes through a tear and separates the neurosensory retina from the pigment epithelium/choroid (shown lifted).</li><li>Flashes, new floaters, then a “curtain” over part of the visual field; painless.</li><li>Emergency: laser/cryo for tears; pneumatic retinopexy, scleral buckle or vitrectomy for detachment.</li></ul>',
  cra:'<ul><li><b>Central retinal artery occlusion</b>: sudden, painless monocular vision loss.</li><li>The retina turns pale (ischemic) while the fovea stays red: <b>cherry-red spot</b>, because it is supplied by the choroid.</li><li>Embolic source (carotid, heart); consider giant cell arteritis. Ocular emergency.</li></ul>'};
 return{labels:L,info:infos[c]};
}};

/* ---------- UI ---------- */
const tabs=document.getElementById('tabs'),ctlBox=document.getElementById('controls'),infoBox=document.getElementById('info'),titleEl=document.getElementById('title');
let cur=null,st={},labels=[],update=null,labEls=[];
function showLabels(){return true}
function render(){
 while(root.children.length)root.remove(root.children[0]);
 labBox.innerHTML='';labEls=[];
 const g=new THREE.Group();root.add(g);
 const r=cur.build(g,st);
 g.position.set(-cur.center[0],-cur.center[1],-cur.center[2]);
 labels=r.labels||[];update=r.update||null;
 labels.forEach(l=>{const e=document.createElement('div');e.className='lab';e.textContent=l.t;labBox.appendChild(e);labEls.push(e);});
 infoBox.innerHTML=r.info||'';
}
function openScene(k){
 cur=SC[k];st={};
 [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 titleEl.textContent=cur.title;ctlBox.innerHTML='';
 cur.controls.forEach(c=>{
  st[c.k]=c.def;
  const w=document.createElement('div');
  if(c.type==='chk'){w.className='chk';const i=document.createElement('input');i.type='checkbox';i.checked=!!c.def;i.id='c_'+c.k;i.onchange=()=>{st[c.k]=i.checked;render();};const l=document.createElement('label');l.htmlFor=i.id;l.textContent=c.label;w.append(i,l);}
  else{w.className='ctl';const l=document.createElement('label');l.textContent=c.label;const s=document.createElement('select');c.opts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];s.appendChild(op);});s.value=c.def;s.onchange=()=>{st[c.k]=s.value;render();};w.append(l,s);}
  ctlBox.appendChild(w);});
 root.rotation.set(cur.rot[0],cur.rot[1],0);cam.position.z=cur.zoom;
 render();
}
Object.keys(SC).forEach(k=>{const b=document.createElement('button');b.textContent=SC[k].tab;b.dataset.k=k;b.onclick=()=>{openScene(k);location.hash=k;};tabs.appendChild(b);});

/* ---------- interaction ---------- */
let drag=false,px=0,py=0;
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab';});
cv.addEventListener('pointermove',e=>{if(!drag)return;root.rotation.y+=(e.clientX-px)*.008;root.rotation.x=Math.max(-1.5,Math.min(1.5,root.rotation.x+(e.clientY-py)*.008));px=e.clientX;py=e.clientY;});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.position.z=Math.max(3,Math.min(16,cam.position.z*(1+e.deltaY*.001)));},{passive:false});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);

const clock=new THREE.Clock();
function frame(){
 requestAnimationFrame(frame);
 const t=clock.getElapsedTime();
 if(update)update(t);
 root.updateMatrixWorld(true);
 const w=stage.clientWidth,h=stage.clientHeight;
 labels.forEach((l,i)=>{const v=root.localToWorld(V(l.p[0]-cur.center[0],l.p[1]-cur.center[1],l.p[2]-cur.center[2]));v.project(cam);
  const e=labEls[i];e.style.transform=`translate(${(v.x*.5+.5)*w+8}px,${(-v.y*.5+.5)*h}px) translateY(-50%)`;e.style.display=v.z>1?'none':'block';});
 renderer.render(scene,cam);
}
resize();openScene(location.hash.slice(1) in SC?location.hash.slice(1):'heart');frame();
</script>
